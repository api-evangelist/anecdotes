- aid: anecdotes:anecdotes-fedramp-20x-api
  name: Anecdotes FedRAMP 20x Trust Center API
  description: 'A three-tier API over the Anecdotes Trust Center. Public endpoints require no
    authentication and return Cloud Service Offering metadata, the status-page rollup, the
    Recommended Secure Configuration index and downloadable API documentation. An authorization
    tier exchanges an API key for a JWT, and gated endpoints return the full authorization
    package, individual Key Security Indicators, and the evidence and evidence history behind
    each one.'
  humanURL: https://help.anecdotes.ai/technical-setup/fedramp-20x-trust-center-and-api
  baseURL: https://api.anecdotes.ai
  tags:
  - FedRAMP
  - Trust Center
  - Compliance
  - Evidence
  properties:
