- aid: anecdotes:anecdotes-custom-fields-api
  name: anecdotes Custom Fields API
  description: >-
    **Custom fields** extend platform resources (including **requirements**) with your own **dropdown**,
    **multi-select**, or **free-text** values. These endpoints manage the field **definitions** — create
    one, list them, and read a single definition to discover its **`field_metadata.values`** (the `{option_id:
    label}` map used when setting dropdown / multi-select values). Field definitions are shared across
    resource types; scope a field to requirements with **`resource_types: ["REQUIREMENT"]`**.
