- aid: anecdotes:anecdotes-mcp-proxy
  name: Anecdotes MCP Proxy
  description: 'A hosted Model Context Protocol proxy that exposes Anecdotes GRC domains -
    risk, control, evidence, policy, framework, uar, analysis, comments, requirement and
    semantic search - to any MCP-capable AI client. Reachable over streamable HTTP at
    https://mcp.anecdotes.ai/{domain}/mcp with an X-anecdotes-api-key header, or through the
    first-party @anecdotes.ai/mcp npm bridge. Requires an Admin-privileged API token and an
    active AI suite entitlement.'
  humanURL: https://help.anecdotes.ai/technical-setup/api/using-anecdotes-mcp
  baseURL: https://mcp.anecdotes.ai
