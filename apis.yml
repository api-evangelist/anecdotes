- aid: anecdotes:anecdotes-create-evidence-api
  name: anecdotes Create Evidence API
  description: >-
    Create custom **Evidence Collections**, **attach** JSON/CSV files to a collection, and upload **manual**
    evidence of any type. Customer-pushed evidence can also carry **IPE** (Information Produced by Entity)
    — the structured queries that produced the data — supplied inline (`evidence_api_query`) or as a JSON
    file (`ipe_file`) on create/attach, or added later to an existing collection via the `/ipe` endpoint.
    IPE can only be written to API (customer-pushed) evidence.
  humanURL: https://help.anecdotes.ai/api/overview
