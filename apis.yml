aid: anecdotes
name: anecdotes
description: 'anecdotes is an enterprise Governance, Risk and Compliance (GRC) platform,
  founded in 2020 and headquartered in Tel Aviv, that pairs a GRC data engine with AI agents
  to replace point-in-time audit cycles with continuous, evidence-backed compliance. Its
  Compliance OS collects evidence automatically from 230+ pre-built plugins into 1,000+
  predefined artifacts, maps that evidence across 60+ frameworks at once, and drives core
  applications for controls, requirements, risk, policy management, findings and user access
  review. Developers reach the platform through a documented REST API at api.anecdotes.ai
  (API key exchanged for a short-lived JWT), a hosted MCP Proxy at mcp.anecdotes.ai that
  exposes GRC domains as agent tools, a FedRAMP 20x Trust Center API with genuinely public
  endpoints, SAML SSO and SCIM provisioning, and outbound event webhooks driven by Playbooks.'
url: https://raw.githubusercontent.com/api-evangelist/anecdotes/refs/heads/main/apis.yml
