apis:
- aid: anecdotes:anecdotes-grc-api
  name: Anecdotes GRC API
  description: 'The Anecdotes API provides programmatic access to the Anecdotes GRC platform:
    frameworks, requirements, controls, custom fields, risks, findings, policies, analysis
    rules and evidence. Authentication is two-step - an API token created in the platform is
    exchanged at GET /identity/v1/apikey/exchange for a JWT valid for one hour, which is then
    sent as a bearer token on every other call. A descriptive User-Agent header is required or
    the API returns 403.'
  humanURL: https://help.anecdotes.ai/api/overview
  baseURL: https://api.anecdotes.ai
