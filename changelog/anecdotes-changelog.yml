entries:
- date: '2026-07'
  title: New Evidence Page
  kind: additions
  breaking: false
  highlights:
  - Evidence page redesigned for exploring and analyzing evidence.
  - Integrated Chat GRC in a side panel.
  - New left-side navigation between evidence views.
- date: '2026-06-30'
  title: Custom IPE for API Evidence
  kind: additions
  breaking: false
  api_affecting: true
  highlights:
  - An IPE can now be attached to uploaded API evidence, either on a new data push or after the push.
  - Exports note the IPE was generated by an external system, since Anecdotes cannot validate collection.
  related_operations: [attachEvidenceIpe]
- date: '2026-06-10'
  title: Fieldguide Integration Enhancements
  kind: additions
  breaking: false
  highlights:
  - Evidence metadata export to Fieldguide in configurable formats.
  - Configurable Fieldguide Request status updates on synchronization.
- date: '2026-05-26'
  title: Multiple Risk Registers, Risk Appetite, in-platform risk import
  kind: additions
  breaking: false
  api_affecting: true
  highlights:
  - Risks can be organized across multiple registers, each with its own fields, structure, settings and risk appetite.
  - Risk appetite thresholds with above/within indicators, filtering, notifications and optional enforcement rules.
  - Self-serve risk import into a specific register from a dynamic CSV template.
- date: '2026-05-25'
  title: Recommended Secure Configuration Runtime API published
  kind: additions
  breaking: false
  api_affecting: true
  source: https://help.anecdotes.ai/technical-setup/recommended-secure-configuration/runtime-api
  highlights:
  - Four read-only endpoints published at gateway.anecdotes.ai/identity/v1/ - baseline version 1.0.0.
- date: '2026-04-27'
  title: Fieldguide Integration Indicators
  kind: additions
  breaking: false
  highlights:
  - Framework-level indication of Fieldguide engagement linkage.
  - Control-level sync status for controls marked visible to auditors.
- date: '2026-02-24'
  title: Auto-downgrade Control Status Playbook and ChatGRC Recipes
  kind: additions
  breaking: false
  highlights:
  - New automated playbook that prevents post-approval changes to controls to protect audit integrity.
  - Library of predefined ChatGRC prompts for common GRC workflows.
