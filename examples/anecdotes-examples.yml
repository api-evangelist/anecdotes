  source: https://help.anecdotes.ai/technical-setup/api/using-the-anecdotes-api
  provenance: provider-published
  language: shell
  snippet: |
    curl --location --request GET 'https://api.anecdotes.ai/identity/v1/apikey/exchange' \
    --header 'x-anecdotes-api-key: <YOUR-API-TOKEN-HERE>'
