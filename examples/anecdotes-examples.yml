- name: Exchange an API key with an explicit User-Agent
  kind: request
  operation: exchangeApiKey
  source: https://help.anecdotes.ai/api/overview
  provenance: provider-published
  language: python
  snippet: |
    import urllib.request, os

    req = urllib.request.Request(
        "https://api.anecdotes.ai/identity/v1/apikey/exchange",
        headers={
         "x-anecdotes-api-key": os.environ["ANECDOTES_API_KEY"],
         "User-Agent": "your-app-name/1.0 (+contact@domain.com)"},
    )
    print(urllib.request.urlopen(req).read().decode())
