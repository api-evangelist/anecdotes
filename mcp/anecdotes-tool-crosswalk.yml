summary: >-
  Binds each tool published by the Anecdotes MCP Proxy to the REST operation(s) that back it in the
  Anecdotes GRC API. Because the live tools/list manifest is edge-blocked to anonymous callers, tools are
  mapped by name and by the provider's own description of each domain, and confidence is recorded
  accordingly. Where a binding is high, the tool's real input contract is the referenced operation's
  parameters and requestBody in openapi/anecdotes-grc-openapi.yml.
