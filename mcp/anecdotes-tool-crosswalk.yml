observations:
- The MCP surface is overwhelmingly read-oriented - update_controls is the only documented write tool,
  while the REST surface exposes creates, updates and deletes across risks, controls, requirements,
  policies, findings, custom fields and evidence.
- Two whole product areas reachable by agents (User Access Review, Comments) have no public REST
  operation, so the MCP proxy is not a strict subset of the REST API.
