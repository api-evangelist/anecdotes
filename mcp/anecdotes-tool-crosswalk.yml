    gated: true
    note: Every operation except the API key exchange requires a bearer JWT.
  mcp:
    url: https://mcp.anecdotes.ai/all/mcp
    gated: true
    note: tools/list returned HTTP 403 (Cloudflare edge) without an X-anecdotes-api-key header.
