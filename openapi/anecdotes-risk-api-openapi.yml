openapi: 3.2.0
info:
  title: Anecdotes Risk API
  version: 1.0.0
  contact:
    name: Anecdotes
    url: https://help.anecdotes.ai/api/overview
    email: hello@anecdotes.ai
  description: 'Operations tagged Risk across 2 of this provider''s published API definitions: anecdotes-grc-openapi-original.json, anecdotes-grc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.anecdotes.ai
  description: Production
security:
- Bearer: []
tags:
- name: Risk
  description: '**Risks** live in **risk registers** in Risk Manager: inherent/residual dimensions, treatment, custom fields, and links to evidence. **API:** create, list (full), get, update. [Risk Manager](https://help.anecdotes.ai/product-tour/risk-manager) · [Getting started](https://help.anecdotes.ai/product-tour/risk-manager/getting-started-risk-management)'
paths:
  /risk/v1/risk:
    post:
      tags:
      - Risk
      summary: Create Risk
      description: Create a new risk.
      operationId: createRisk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Risk_NewRisk'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk_CustomerRiskModel'
        '401':
          description: Unauthorized - JWT is missing, invalid, or expired. Exchange a new API key for a fresh JWT.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    servers:
    - url: https://api.anecdotes.ai
      description: Production
  /risk/v1/risk/full:
    get:
      tags:
      - Risk
      summary: Get Risks
      description: List of risks and its associated data.
      operationId: getRisks
      parameters:
      - name: risk_ids
        in: query
        required: false
        schema:
          type: string
          title: Risk Ids
          description: Optional comma-separated list of risk IDs to filter by.
        description: Optional comma-separated list of risk IDs to filter by.
      - name: exclude_review
        in: query
        required: false
        schema:
          type: boolean
          title: Exclude Review
          description: When false, includes risks that have reviewer access from users with specific roles. Defaults to false.
          default: false
        description: When false, includes risks that have reviewer access from users with specific roles. Defaults to false.
      - name: limit
        in: query
        schema:
          type: integer
        description: Maximum number of risks to return.
      - name: offset
        in: query
        schema:
          type: integer
        description: Number of risks to skip (for pagination).
      responses:
        '200':
          description: Array of risk objects with treatment plan data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Risk_CustomerFullRiskModel'
        '401':
          description: Unauthorized - JWT is missing, invalid, or expired. Exchange a new API key for a fresh JWT.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    servers:
    - url: https://api.anecdotes.ai
      description: Production
  /risk/v1/risk/{risk_id}:
    get:
      tags:
      - Risk
      summary: Get Risk
      description: Get a Risk by its ID.
      operationId: getRisk
      parameters:
      - name: risk_id
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the risk.
        description: The unique identifier of the risk.
      responses:
        '200':
          description: Risk object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk_CustomerRiskModel'
        '401':
          description: Unauthorized - JWT is missing, invalid, or expired. Exchange a new API key for a fresh JWT.
        '422':
          description: Validation Error - The request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    patch:
      tags:
      - Risk
      summary: Update Risk
      description: Update a specific risk.
      operationId: updateRisk
      parameters:
      - name: risk_id
        in: path
        required: true
        schema:
          type: string
          description: The unique identifier of the risk to update.
        description: The unique identifier of the risk to update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Risk_CustomerUpdatedRiskModel'
      responses:
        '200':
          description: Updated risk object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risk_CustomerRiskModel'
        '401':
          description: Unauthorized - JWT is missing, invalid, or expired. Exchange a new API key for a fresh JWT.
        '422':
          description: Validation Error - The request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    servers:
    - url: https://api.anecdotes.ai
      description: Production
components:
  schemas:
    Risk_NewRisk:
      properties:
        name:
          type: string
          title: Name
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        customer_risk_id:
          type: string
          title: Customer Risk Id
        register_id:
          type: string
          title: Register Id
          description: The risk register to create the risk in.
        fields:
          type: object
          title: Fields
          description: Custom field values as a mapping of field ID to value (string or array of strings).
          additionalProperties:
            oneOf:
            - type: string
            - type: array
              items:
                type: string
      type: object
      required:
      - name
      title: NewRisk
      description: Request body for creating a new risk via **POST /risk/v1/risk**. Only `name` is required; all other fields are optional.
    Risk_CycleStatus:
      enum:
      - Setup Incomplete
      - Not Started
      - Missing File
      - On Hold
      - In Progress
      - Changes Required
      - Approved
      - Scheduled
      - Sent For Approval
      - Approval Required
      - Implemented
      - Action Required
      title: CycleStatus
      description: An enumeration.
    Risk_RiskAutoCalc:
      properties:
        enabled:
          type: boolean
          title: Enabled
        status:
          allOf:
          - $ref: '#/components/schemas/Risk_ActionStatus'
          default: PENDING
        residual_risk_level:
          type: number
          title: Residual Risk Level
        residual_impact:
          type: number
          title: Residual Impact
        residual_likelihood:
          type: number
          title: Residual Likelihood
      type: object
      required:
      - enabled
      title: RiskAutoCalc
