        global_id:
          type: string
          title: Global Id
        inherent_risk_level_name:
          type: string
          title: Inherent Risk Level Name
        inherent_risk_level_impact_name:
          type: string
          title: Inherent Risk Level Impact Name
        inherent_risk_level_likelihood_name:
          type: string
