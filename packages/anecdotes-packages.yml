summary: >-
  Anecdotes publishes one first-party client library: the @anecdotes.ai/mcp npm bridge that connects an
  MCP client (Claude Desktop, Cursor, Copilot and other MCP-capable tools) to the hosted Anecdotes MCP
  Proxy. No conventional per-language REST SDK is published for the Anecdotes GRC API - the documentation
  shows raw cURL, Python urllib and third-party automation platforms (Tines, n8n) calling the REST
  endpoints directly.
